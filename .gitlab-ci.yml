stages:
  - build
  - deploy

# Frontend job
frontend_build:
  stage: build
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist

# Backend job
backend_build:
  stage: build
  script:
    - cd backend
    - npm install

# Deploy job (for both frontend and backend)
deploy:
  stage: deploy
  script:
    - chmod +x deploy.sh
    - ./deploy.sh
  only:
    - master
